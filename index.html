<style>

.card{box-shadow:0 1px 3px #1c2b3a14}

h1,h2,h3{color:#16324f;letter-spacing:-.01em}

.hero{background:linear-gradient(135deg,#1f6fa8,#13808a)!important;color:#fff}

body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}

button,select,input,textarea{font:inherit}
.crisis{background:#7a1f2b;color:#fff;padding:.5rem 1rem;text-align:center;font-size:.9rem;position:sticky;top:0;z-index:20}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin:.75rem 0}

.chip.on{background:var(--brand);color:#fff}
.tag{display:inline-block;background:var(--soft);border-radius:6px;padding:.1rem .45rem;margin:.1rem;font-size:.8rem}
.row{display:flex;gap:1rem;align-items:flex-start}
.avatar{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.3rem}
.muted{color:var(--muted);font-size:.9rem}
.open{border-radius:8px;padding:.35rem .6rem;font-size:.88rem;margin-top:.4rem}
.open.ok{background:var(--okbg);color:var(--ok)}
.open.stale{background:var(--warnbg);color:var(--warn)}
.open.none{background:#eee;color:#555}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem}
.filters select,.filters input,form input,form select,form textarea{width:100%;padding:.5rem;border:1px solid var(--line);border-radius:8px;background:#fff}
.toggle{display:inline-flex;border:2px solid var(--brand);border-radius:10px;overflow:hidden;margin:.5rem 0}
.toggle button{border:0;background:#fff;color:var(--brand);padding:.4rem .9rem;cursor:pointer;font-weight:600}
.toggle button[aria-pressed=true]{background:var(--brand);color:#fff}

<script>
/* ===== CONFIG: change the brand name here (one line) ===== */
const BRAND = "Psychiatric Provider";

const TODAY = new Date(); // stale check uses the real current date
const STALE_DAYS = 30;

/* ===== SAMPLE DATA (fictional) ===== */

const cityOpts=(sel,blank,st)=>`<option value="">${blank}</option>`+Object.entries(STATES).filter(([k])=>!st||k===st).map(([sk,sv])=>`<optgroup label="${sv}">`+Object.entries(citiesIn(sk)).map(([k,v])=>`<option value="${k}"${k===sel?" selected":""}>${v}</option>`).join("")+`</optgroup>`).join("");
const INSURERS = ["Aetna","Blue Cross Blue Shield","Cigna","UnitedHealthcare","Medicaid","Anthem","Self-pay"];

const PRACTICES = [
 {id:"clean-page",name:"Clean Page Counseling Group",city:"frisco",about:"Group practice focused on trauma recovery, EMDR, and family work.",insurance:["Aetna","Cigna","Blue Cross Blue Shield","Self-pay"],phone:"(555) 010-2001",intake:true},
 {id:"willow-path",name:"Willow Path Family Therapy",city:"mckinney",about:"Child, teen, and family therapy with a dedicated play therapy room.",insurance:["Aetna","Medicaid","UnitedHealthcare","Self-pay"],phone:"(555) 010-2002",intake:true},

 {id:"bluebonnet",name:"Bluebonnet Behavioral Health",city:"austin",about:"Therapy and psychiatry for adults and teens in Central Texas.",insurance:["Blue Cross Blue Shield","Aetna","UnitedHealthcare","Self-pay"],phone:"(555) 010-2005",intake:true},
 {id:"bayou-city",name:"Bayou City Counseling Collective",city:"houston",about:"Trauma-informed therapy with bilingual clinicians.",insurance:["Cigna","Medicaid","Aetna","Self-pay"],phone:"(555) 010-2006",intake:true},
 {id:"circle-city",name:"Circle City Therapy Group",city:"indianapolis",about:"Indianapolis group practice for anxiety, ADHD, and family work.",insurance:["Anthem","Cigna","UnitedHealthcare","Medicaid","Self-pay"],phone:"(555) 010-2007",intake:true},
 {id:"hamilton-psych",name:"Hamilton County Psychiatry",city:"carmel",about:"Psychiatric evaluation and medication management serving Carmel and Fishers.",insurance:["Anthem","Aetna","UnitedHealthcare"],phone:"(555) 010-2008",intake:true}

const CLINICIANS = [
 {id:"maya-reyes",name:"Maya Reyes",cred:"LPC-S",practice:"clean-page",city:"frisco",specialties:["emdr","trauma","anxiety"],insurance:["Aetna","Cigna","Self-pay"],langs:["English","Spanish"],telehealth:true,nextOpening:"2026-11-04",lastConfirmed:"2026-10-27",bio:"I help adults heal from trauma using EMDR in a calm, paced way."},
 {id:"daniel-okafor",name:"Daniel Okafor",cred:"LCSW",practice:"clean-page",city:"frisco",specialties:["trauma","depression","adhd"],insurance:["Aetna","Blue Cross Blue Shield"],langs:["English"],telehealth:true,nextOpening:null,lastConfirmed:"2026-10-21",bio:"Practical, warm therapy for adults managing ADHD, depression, and stress."},
 {id:"priya-nair",name:"Priya Nair",cred:"LMFT",practice:"clean-page",city:"frisco",specialties:["emdr","couples"],insurance:["Cigna","Self-pay"],langs:["English","Hindi"],telehealth:false,nextOpening:"2026-11-10",lastConfirmed:"2026-08-30",bio:"Couples work and EMDR for relationship trauma."},
 {id:"hannah-cole",name:"Hannah Cole",cred:"LPC, RPT",practice:"willow-path",city:"mckinney",specialties:["play-therapy","anxiety","adhd"],insurance:["Aetna","Medicaid"],langs:["English"],telehealth:false,nextOpening:"2026-11-02",lastConfirmed:"2026-10-25",bio:"Registered Play Therapist working with kids ages 3–12."},
 {id:"luis-garza",name:"Luis Garza",cred:"LMFT",practice:"willow-path",city:"mckinney",specialties:["play-therapy","couples","trauma"],insurance:["UnitedHealthcare","Medicaid","Self-pay"],langs:["English","Spanish"],telehealth:true,nextOpening:"2026-11-15",lastConfirmed:"2026-09-12",bio:"Family systems and play therapy; bilingual sessions available."},
 {id:"ava-brooks",name:"Ava Brooks",cred:"LPC Associate",practice:"willow-path",city:"mckinney",specialties:["play-therapy","emdr"],insurance:["Aetna","Self-pay"],langs:["English"],telehealth:false,nextOpening:"2026-10-31",lastConfirmed:"2026-10-28",bio:"Child-centered play therapy and EMDR adapted for kids."},
 {id:"samir-haddad",name:"Dr. Samir Haddad",cred:"MD, Psychiatrist",practice:"lakeside-mind",city:"lewisville",specialties:["medication","adhd","depression"],insurance:["Blue Cross Blue Shield","UnitedHealthcare"],langs:["English","Arabic"],telehealth:true,nextOpening:"2026-11-20",lastConfirmed:"2026-10-15",bio:"Board-certified adult psychiatrist."},
 {id:"grace-lin",name:"Grace Lin",cred:"PMHNP-BC",practice:"lakeside-mind",city:"lewisville",specialties:["medication","anxiety"],insurance:["Aetna","Blue Cross Blue Shield"],langs:["English","Mandarin"],telehealth:true,nextOpening:"2026-11-06",lastConfirmed:"2026-07-20",bio:"Psychiatric nurse practitioner for anxiety and mood."},
 {id:"tom-becker",name:"Tom Becker",cred:"LMFT",practice:"oak-harbor",city:"southlake",specialties:["couples","depression"],insurance:["Cigna","Self-pay"],langs:["English"],telehealth:true,nextOpening:"2026-11-03",lastConfirmed:"2026-10-24",bio:"Gottman-informed couples therapy."},
 {id:"rachel-stein",name:"Rachel Stein",cred:"LPC",practice:null,city:"southlake",specialties:["emdr","trauma","anxiety"],insurance:["Aetna","UnitedHealthcare"],langs:["English"],telehealth:true,nextOpening:"2026-11-08",lastConfirmed:"2026-10-19",bio:"Solo practice; EMDR intensives for single-incident trauma."},
 {id:"elena-ruiz",name:"Elena Ruiz",cred:"LPC",practice:"bluebonnet",city:"austin",specialties:["anxiety","depression","trauma"],insurance:["Blue Cross Blue Shield","Aetna","Self-pay"],langs:["English","Spanish"],telehealth:true,nextOpening:"2026-11-05",lastConfirmed:"2026-10-26",bio:"Calm, collaborative therapy for anxiety and life transitions."},
 {id:"james-whit",name:"Dr. James Whitaker",cred:"MD, Psychiatrist",practice:"bluebonnet",city:"austin",specialties:["medication","adhd"],insurance:["UnitedHealthcare","Blue Cross Blue Shield"],langs:["English"],telehealth:true,nextOpening:"2026-11-12",lastConfirmed:"2026-10-20",bio:"Adult and adolescent psychiatry."},
 {id:"keisha-grant",name:"Keisha Grant",cred:"LCSW",practice:"bayou-city",city:"houston",specialties:["trauma","emdr","depression"],insurance:["Cigna","Medicaid","Self-pay"],langs:["English"],telehealth:true,nextOpening:"2026-11-03",lastConfirmed:"2026-10-27",bio:"EMDR and trauma recovery for adults."},
 {id:"oscar-mendez",name:"Oscar Mendez",cred:"LMFT",practice:"bayou-city",city:"houston",specialties:["couples","play-therapy"],insurance:["Aetna","Medicaid"],langs:["English","Spanish"],telehealth:false,nextOpening:"2026-11-18",lastConfirmed:"2026-09-05",bio:"Family and couples therapy; bilingual."},
 {id:"nina-patel",name:"Nina Patel",cred:"LPC",practice:null,city:"dallas",specialties:["anxiety","adhd"],insurance:["Aetna","Cigna"],langs:["English","Gujarati"],telehealth:true,nextOpening:"2026-11-07",lastConfirmed:"2026-10-22",bio:"Solo practice for young professionals."},
 {id:"cody-ray",name:"Cody Ray",cred:"LPC",practice:null,city:"fort-worth",specialties:["trauma","depression"],insurance:["Blue Cross Blue Shield","Self-pay"],langs:["English"],telehealth:true,nextOpening:"2026-11-09",lastConfirmed:"2026-10-18",bio:"Veterans and first responders."},
 {id:"sofia-lozano",name:"Sofia Lozano",cred:"LPC, RPT",practice:null,city:"san-antonio",specialties:["play-therapy","anxiety"],insurance:["Medicaid","UnitedHealthcare"],langs:["English","Spanish"],telehealth:false,nextOpening:"2026-11-04",lastConfirmed:"2026-10-24",bio:"Play therapy for children 3–12."},
 {id:"megan-hart",name:"Megan Hart",cred:"LMHC",practice:"circle-city",city:"indianapolis",specialties:["anxiety","adhd","emdr"],insurance:["Anthem","Cigna","Self-pay"],langs:["English"],telehealth:true,nextOpening:"2026-11-02",lastConfirmed:"2026-10-28",bio:"Indiana LMHC; EMDR and ADHD coaching."},
 {id:"andre-cole",name:"Andre Coleman",cred:"LCSW",practice:"circle-city",city:"indianapolis",specialties:["play-therapy","trauma"],insurance:["Medicaid","UnitedHealthcare"],langs:["English"],telehealth:false,nextOpening:null,lastConfirmed:"2026-10-23",bio:"Kids, teens, and family trauma work."},
 {id:"lauren-kim",name:"Lauren Kim",cred:"PMHNP-BC",practice:"hamilton-psych",city:"carmel",specialties:["medication","anxiety","depression"],insurance:["Anthem","Aetna"],langs:["English","Korean"],telehealth:true,nextOpening:"2026-11-06",lastConfirmed:"2026-10-25",bio:"Medication management for mood and anxiety."},
 {id:"ben-foster",name:"Dr. Ben Foster",cred:"MD, Psychiatrist",practice:"hamilton-psych",city:"fishers",specialties:["medication","adhd"],insurance:["Anthem","UnitedHealthcare"],langs:["English"],telehealth:true,nextOpening:"2026-11-19",lastConfirmed:"2026-08-15",bio:"Adult ADHD and mood disorders."},
 {id:"ruth-adler",name:"Ruth Adler",cred:"LMFT",practice:null,city:"bloomington",specialties:["couples","depression"],insurance:["Anthem","Self-pay"],langs:["English"],telehealth:true,nextOpening:"2026-11-10",lastConfirmed:"2026-10-21",bio:"Couples therapy near IU campus."},
 {id:"tyler-quinn",name:"Tyler Quinn",cred:"LMHC",practice:null,city:"fort-wayne",specialties:["trauma","emdr","anxiety"],insurance:["Anthem","Cigna","Medicaid"],langs:["English"],telehealth:true,nextOpening:"2026-11-03",lastConfirmed:"2026-10-26",bio:"EMDR for adults in Northeast Indiana."},
 {id:"marco-silva",name:"Marco Silva",cred:"LCSW",practice:null,city:"frisco",specialties:["adhd","play-therapy"],insurance:["Medicaid","Self-pay"],langs:["English","Portuguese","Spanish"],telehealth:false,nextOpening:null,lastConfirmed:"2026-08-01",bio:"Solo practice for kids and teens with ADHD."}
];

/* ===== STORAGE (localStorage only) ===== */
const LS = {
 get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ===== HELPERS ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const daysSince = iso => Math.floor((TODAY - new Date(iso+"T12:00:00"))/864e5);
const practiceOf = c => PRACTICES.find(p=>p.id===c.practice);
const teamOf = p => CLINICIANS.filter(c=>c.practice===p.id);
const initials = n => n.replace("Dr. ","").split(" ").map(w=>w[0]).join("");
const color = id => ["#2f6f62","#3d7fa6","#6a5d9e","#a6643d","#4f7d3a"][id.length%5];

/* ===== DIFFERENTIATOR 2: STRUCTURED OPENINGS + STALE FLAG ===== */
function isStale(c){return daysSince(c.lastConfirmed) > STALE_DAYS}
function isOpen(c){return !!c.nextOpening && !isStale(c)}
function openingBadge(c){
  const conf = `last confirmed ${fmt(c.lastConfirmed)}`;
  if(isStale(c)) return `<div class="open stale">⚠ Possibly out of date — ${c.nextOpening?"next opening listed as "+fmt(c.nextOpening):"no opening listed"}; ${conf} (${daysSince(c.lastConfirmed)} days ago)</div>`;
  if(!c.nextOpening) return `<div class="open none">Not accepting new clients · ${conf}</div>`;
  return `<div class="open ok">✓ Next opening ${fmt(c.nextOpening)} · ${conf}</div>`;
}
function practiceOpenings(p){
  const t = teamOf(p), open = t.filter(isOpen).sort((a,b)=>a.nextOpening.localeCompare(b.nextOpening));
  return open.length ? `<div class="open ok">✓ ${open.length} of ${t.length} clinicians have verified openings · soonest ${fmt(open[0].nextOpening)}</div>`
                     : `<div class="open none">No verified openings right now</div>`;
}

/* ===== DIFFERENTIATOR 8: FAVORITES (clinicians + practices) ===== */
function favs(){return LS.get("pp_favs",{c:[],p:[]})}
function isFav(t,id){return favs()[t].includes(id)}
function toggleFav(t,id){const f=favs();f[t]=f[t].includes(id)?f[t].filter(x=>x!==id):[...f[t],id];LS.set("pp_favs",f);updateCount();route()}
function favBtn(t,id){const on=isFav(t,id);return `<button type="button" class="fav" aria-pressed="${on}" data-fav="${t}" data-id="${id}">${on?"♥ Saved":"♡ Save"}</button>`}
function updateCount(){const f=favs();$("#savedCount").textContent=f.c.length+f.p.length}

/* ===== CARDS ===== */
function clinicianCard(c){
  const p = practiceOf(c);
  return `<article class="card"><div class="row">
   <div class="avatar" style="background:${color(c.id)}" aria-hidden="true">${initials(c.name)}</div>
   <div style="flex:1"><h3 style="margin:0"><a href="#/clinician/${c.id}">${esc(c.name)}</a>, <span class="muted">${esc(c.cred)}</span></h3>
   <div class="muted">${place(c.city)} · ${p?`<a href="#/practice/${p.id}">${esc(p.name)}</a>`:"Solo practice"}${c.telehealth?" · Telehealth":""}</div>
   <div>${c.specialties.map(s=>`<span class="tag">${SPECIALTIES[s]}</span>`).join("")}</div>
   <div class="muted">Insurance: ${c.insurance.join(", ")}</div>
   ${openingBadge(c)}
   <div style="margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap"><a class="btn sm" href="#/request/clinician/${c.id}">Request appointment</a>${favBtn("c",c.id)}</div>
   </div></div></article>`;
}
function practiceCard(p){
  const t = teamOf(p);
  const specs=[...new Set(t.flatMap(c=>c.specialties))];
  return `<article class="card"><h3 style="margin:0"><a href="#/practice/${p.id}">${esc(p.name)}</a></h3>
   <div class="muted">Group practice · ${place(p.city)} · ${t.length} clinicians</div>
   <div>${specs.map(s=>`<span class="tag">${SPECIALTIES[s]}</span>`).join("")}</div>
   <div class="muted">Insurance: ${p.insurance.join(", ")}</div>
   ${practiceOpenings(p)}
   <div style="margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap"><a class="btn sm" href="#/request/practice/${p.id}">Request — match me to a clinician</a>${favBtn("p",p.id)}</div></article>`;
}

/* ===== SEARCH / FILTER LOGIC ===== */
function filterClinicians(q){
  return CLINICIANS.filter(c=>
    (!q.specialty||c.specialties.includes(q.specialty)) &&
    (!q.state||stateOf(c.city)===q.state) && (!q.city||c.city===q.city) &&
    (!q.insurance||c.insurance.includes(q.insurance)) &&
    (!q.type||(q.type==="group"?!!c.practice:!c.practice)) &&
    (!q.open||isOpen(c)) &&
    (!q.tele||c.telehealth)
  ).sort((a,b)=>(isOpen(b)-isOpen(a))||((a.nextOpening||"9")>(b.nextOpening||"9")?1:-1));
}
function filterPractices(q){

/* ===== ACTIONS / ROUTER (in-memory — works when hashchange is blocked) ===== */
let ROUTE_PATH = "/";
let ROUTE_QUERY = {};

function readHash(){
  const raw = (location.hash || "#/").replace(/^#/, "") || "/";
  const [pathPart, qs] = raw.split("?");
  const path = pathPart.startsWith("/") ? pathPart : "/" + pathPart;
  const query = Object.fromEntries(new URLSearchParams(qs || ""));
  return {path: path === "" ? "/" : path, query};
}
function syncFromHash(){
  const h = readHash();
  ROUTE_PATH = h.path;
  ROUTE_QUERY = h.query;
}
function navigate(path, query){
  if(!path.startsWith("/")) path = "/" + path;
  ROUTE_PATH = path || "/";
  ROUTE_QUERY = query || {};
  const q = toQuery(ROUTE_QUERY);
  const hash = "#" + ROUTE_PATH + (q ? "?" + q : "");
  try {
    if(location.hash !== hash) location.hash = hash;
    else if(typeof history !== "undefined" && history.replaceState){
      try { history.replaceState(null, "", hash); } catch(e) {}
    }
  } catch(e) {}
  route();
  try { if (typeof window.scrollTo==="function") window.scrollTo(0,0); } catch(e) {}
}
function parseQuery(){ return Object.assign({}, ROUTE_QUERY); }
function setView(v){
  const q = parseQuery();
  q.view = v;
  navigate("/search", q);
}
function routeIntake(candidates,d){
  const fits=candidates.filter(c=>isOpen(c)&&(!d.specialty||c.specialties.includes(d.specialty))&&(!d.insurance||c.insurance.includes(d.insurance))&&(d.format!=="tele"||c.telehealth));
  return fits.sort((a,b)=>a.nextOpening.localeCompare(b.nextOpening))[0]||null;
}
function submitRequest(form,kind,id){
  const d=Object.fromEntries(new FormData(form));
  let toName,match;
  if(kind==="practice"){const p=PRACTICES.find(x=>x.id===id);toName=p.name;match=routeIntake(teamOf(p),d)}
  else{const c=CLINICIANS.find(x=>x.id===id);toName=c.name;match=isOpen(c)?c:(c.practice?routeIntake(teamOf(practiceOf(c)).filter(x=>x.id!==c.id),d):null)}
  const reqs=LS.get("pp_requests",[]);
  reqs.push({kind,id,toName,routedTo:match?match.name:null,at:Date.now(),specialty:d.specialty,insurance:d.insurance,format:d.format});
  LS.set("pp_requests",reqs);
  form.remove();
  $("#reqResult").innerHTML=`<div class="success"><b>Request saved on this device — not sent.</b> This is a prototype; nothing leaves your browser.<br>${
    match?(match.name===toName?`Best fit: <a href="#/clinician/${match.id}" data-nav="/clinician/${match.id}">${esc(match.name)}</a>, next opening ${fmt(match.nextOpening)}.`:`Routed to <a href="#/clinician/${match.id}" data-nav="/clinician/${match.id}">${esc(match.name)}</a> (${esc(match.cred)}), next opening ${fmt(match.nextOpening)}.`)
    :"No one on this team has a verified opening that fits right now; the practice would follow up."}
    <div class="page-actions" style="margin-top:.75rem">
      <button type="button" class="btn" data-home onclick="goHome(event)">← Home</button>
      ${match?`<button type="button" class="btn alt" data-nav="/clinician/${match.id}" onclick="navigate('/clinician/${match.id}',{});return false;">View clinician</button>`:""}
      <button type="button" class="btn alt" data-nav="/saved" onclick="navigate('/saved',{});return false;">View saved</button>
    </div></div>`;
}
function submitJoin(form){
  const d=Object.fromEntries(new FormData(form));const l=LS.get("pp_listings",[]);l.push({...d,at:Date.now()});LS.set("pp_listings",l);
  form.remove();$("#joinResult").innerHTML=`<div class="success"><b>Listing request saved on this device — not sent.</b> Thanks, ${esc(d.contact)}.
    <div class="page-actions" style="margin-top:.75rem">
      <button type="button" class="btn" data-home onclick="goHome(event)">← Home</button>
      <button type="button" class="btn alt" data-nav="/search" onclick="navigate('/search',{});return false;">Browse directory</button>
    </div></div>`;
}

function route(){
  const path = (ROUTE_PATH || "/").replace(/^\//,"").split("/").filter(Boolean);
  const [a,b,c]=path; let html;
  if(!a) html=views.home();
  else if(a==="search") html=views.search();
  else if(a==="clinician"&&b) html=views.clinician(b);
  else if(a==="practice"&&b) html=views.practice(b);
  else if(a==="specialty"&&b&&c) html=views.specialty(b,c);
  else if(a==="request"&&b&&c) html=views.request(b,c);
  else if(a==="saved") html=views.saved();
  else if(a==="join") html=views.join();
  else html=views.notfound();
  $("#app").innerHTML=html;
  updateCount();
  updateHomeBtn();
}

/* Navigation helpers exposed on window for inline onclick backups */
function goHome(e){
  if(e){ try{e.preventDefault(); e.stopPropagation();}catch(err){} }
  navigate("/");
}
function collectForm(form){
  const o = {};
  if(!form) return o;
  form.querySelectorAll("select[name], input[name], textarea[name]").forEach(el=>{
    const name = el.getAttribute("name");
    if(!name) return;
    if(el.type === "checkbox"){ if(el.checked) o[name] = el.value || "1"; return; }
    if(el.type === "radio"){ if(el.checked) o[name] = el.value; return; }
    const v = (el.value || "").trim();
    if(v) o[name] = v;
  });
  return o;
}

  if(e){ try{e.preventDefault(); e.stopPropagation();}catch(err){} }
  const form = document.getElementById("homeSearch") || document.getElementById("filterForm");

document.addEventListener("click", function(e){
  const t = e.target;
  if(!t || !t.closest) return;

  const home = t.closest("[data-home]");
  if(home){ e.preventDefault(); goHome(e); return; }

  if(t.closest("[data-reset-home]")){ e.preventDefault(); resetHomeSearch(e); return; }
  if(t.closest("[data-clear-filters]")){ e.preventDefault(); clearFilters(e); return; }
  if(t.closest("[data-clear-favs]")){ e.preventDefault(); clearFavs(e); return; }
  if(t.closest("[data-clear-reqs]")){ e.preventDefault(); clearReqs(e); return; }

  const run = t.closest("[data-run-search]");
  if(run){
    e.preventDefault();
    if(document.getElementById("filterForm") && !document.getElementById("homeSearch")) runFilterSearch(e);
    else runHomeSearch(e);
    return;
  }

  const backBtn = t.closest("[data-back]");
  if(backBtn){ e.preventDefault(); goHome(e); return; }

  const fav = t.closest("[data-fav]");
  if(fav){
    e.preventDefault();
    toggleFav(fav.getAttribute("data-fav"), fav.getAttribute("data-id"));
    return;
  }

  const viewBtn = t.closest("[data-view]");
  if(viewBtn){ e.preventDefault(); setView(viewBtn.getAttribute("data-view")); return; }

  const chip = t.closest("[data-chip]");
  if(chip){ e.preventDefault(); pickChip(chip.getAttribute("data-chip"), e); return; }

  const nav = t.closest("[data-nav]");
  if(nav){
    e.preventDefault();
    const [np, nq] = (nav.getAttribute("data-nav") || "/").split("?");
    navigate(np || "/", Object.fromEntries(new URLSearchParams(nq || "")));
    return;
  }

  const a = t.closest('a[href^="#"]');
  if(a){
    e.preventDefault();
    const href = a.getAttribute("href") || "#/";
    const raw = href.replace(/^#/, "") || "/";
    const [pathPart, qs] = raw.split("?");
    const path = pathPart.startsWith("/") ? pathPart : "/" + pathPart;
    const query = Object.fromEntries(new URLSearchParams(qs || ""));
    navigate(path || "/", query);
  }
}, true);

document.addEventListener("submit", function(e){
  const form = e.target;
  if(!(form instanceof HTMLFormElement)) return;
  if(form.id === "homeSearch" || form.id === "filterForm"){
    e.preventDefault();
    goSearch(form);
    return;
  }
  if(form.id === "reqForm"){
    e.preventDefault();
    submitRequest(form, form.getAttribute("data-kind"), form.getAttribute("data-target"));
    return;
  }
  if(form.id === "joinForm"){
    e.preventDefault();
    submitJoin(form);
  }
}, true);

document.addEventListener("change", function(e){
  const form = e.target && e.target.closest && e.target.closest("#filterForm");
  if(!form) return;
  if(e.target.name==="state"){ const c=form.querySelector('select[name="city"]'); if(c && c.value && stateOf(c.value)!==e.target.value && e.target.value) c.value=""; }
  goSearch(form);
}, true);

document.title = BRAND + " — Find therapists, psychiatrists & group practices";
$("#logo").textContent = BRAND;
window.addEventListener("hashchange", () => { syncFromHash(); route(); try{ if(typeof window.scrollTo==="function") window.scrollTo(0,0);}catch(e){} });
window.addEventListener("popstate", () => { syncFromHash(); route(); });
syncFromHash();
updateCount();
route();
</script>
